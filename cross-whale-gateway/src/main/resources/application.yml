spring:
  application:
    name: cross-whale-gateway
  profiles:
    active: dev # 激活的配置文件
  config:
    import: optional:nacos:cross-whale-gateway-dev.yaml
    enabled: true
  cloud:
    nacos:
      discovery:
        server-addr: 192.168.3.62:8848 # Nacos 服务地址
        namespace: aaa
      config:
        server-addr: 192.168.3.62:8848 # Nacos 配置中心地址
        file-extension: yaml # 配置文件格式
        namespace: aaa # 可选，Nacos 命名空间 ID
        group: DEFAULT_GROUP # 可选，配置分组


