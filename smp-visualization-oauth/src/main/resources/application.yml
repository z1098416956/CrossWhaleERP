spring:
  application:
    name: smp-oauth-service
  profiles:
    active: dev
  config:
    import: nacos:smp-oauth-web-dev.yaml
    enabled: true
  cloud:
    nacos:
      discovery:
        server-addr: 127.0.0.1:8848
        namespace: zzj
      config:
        server-addr: 127.0.0.1:8848
        file-extension: yaml
        namespace: zzj
        group: DEFAULT_GROUP

